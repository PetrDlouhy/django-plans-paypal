[tox]
envlist =
    {py310,py311,py312,py313}-django-{42,50,51,52}
    py314-django-52
    {py312,py313,py314}-django-{60,61}

[testenv]
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/plans_paypal
commands =
    python -W error::DeprecationWarning -m coverage run manage.py test
    coverage report --fail-under=100
deps =
    django-42: Django>=4.2,<5.0
    django-50: Django>=5.0,<5.1
    django-51: Django>=5.1,<5.2
    django-52: Django>=5.2,<6.0
    django-60: Django>=6.0,<6.1
    django-61: Django>=6.1,<6.2
    -r{toxinidir}/requirements_test.txt
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
