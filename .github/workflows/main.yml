name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    strategy:
      matrix:
        DJANGO_VERSION: ['4.2.*', '5.0.*', '5.1.*', '5.2.*']
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        exclude:
          - DJANGO_VERSION: '5.0.*'
            python-version: '3.9'
          - DJANGO_VERSION: '5.1.*'
            python-version: '3.9'
          - DJANGO_VERSION: '5.2.*'
            python-version: '3.9'

      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
            python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ hashFiles('setup.py') }}-${{ hashFiles('requirements_test.txt') }}-${{ hashFiles('requirements.txt') }}-${{ matrix.DJANGO_VERSION }}
      - name: Install requirements
        run: |
           pip install --upgrade --upgrade-strategy eager -r requirements.txt
           pip install --upgrade --upgrade-strategy eager -r requirements_test.txt
      - name: Install django
        run: pip install Django==${{ matrix.DJANGO_VERSION }}

      - name: Testing
        run: |
          python -W error::DeprecationWarning -m coverage run manage.py test
          coverage xml
          coverage report --fail-under=100

      # The old `pip install codecov` + `codecov` CLI stopped working when
      # Codecov shut down that uploader's endpoint in 2023 - uploads failed
      # silently, so no reports or PR comments ever appeared. The action
      # with OIDC is the supported tokenless upload for public repos.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: django${{ matrix.DJANGO_VERSION }}-py${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          pip install -r requirements_test.txt
      - name: Running Flake8
        run: flake8
      - name: Running isort
        run: python -m isort . --check-only --diff
      - name: Running black
        run: black --check .
      - name: Running mypy
        run: PYTHONPATH="." mypy .
